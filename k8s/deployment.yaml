apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-management

  template:
    metadata:
      labels:
        app: order-management

    spec:
      containers:
        - name: order-management
          image: gangu45/order-management:1.0

          ports:
            - containerPort: 8080